[package]
name = "actor-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13.5"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rig-agent = "0.44.0"
rig-core = { version = "0.44.0", features = ["reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"

[dev-dependencies]
actix-web = "4.17.0"
